services:
  - type: web
    name: acme-salary-management
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm db:generate && corepack pnpm build
    startCommand: corepack pnpm start:production
    initialDeployHook: corepack pnpm db:seed
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/acme.db
    disk:
      name: acme-data
      mountPath: /var/data
      sizeGB: 1
